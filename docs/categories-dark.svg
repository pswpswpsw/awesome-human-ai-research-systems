<svg xmlns="http://www.w3.org/2000/svg" width="860" height="486" viewBox="0 0 860 486" font-family="&quot;Iowan Old Style&quot;,&quot;Palatino Linotype&quot;,Palatino,&quot;Book Antiqua&quot;,Georgia,&quot;Times New Roman&quot;,serif" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">How the five categories are arranged</title>
<desc id="figdesc">A partial view showing two of the five facets. Four categories sit in order on one qualitative scale, what the AI&#8217;s call on an item is worth before the researcher acts: in Delegation it is the record, in Standing Verdicts it stands until someone reverses it, in Human Approval it waits for a named person&#8217;s recorded ruling, in Critique it can never be the record. The order is qualitative, not a measured quantity. Bench sits off that scale because it answers a different question, who settles whether the AI was right: a reader for the other four, a run for Bench. Placement also depends on the other three facets, Scope, Record and Target.</desc>
<rect width="860" height="486" fill="#0d1117"/>
<text x="42" y="32" font-size="14.5" font-weight="600" fill="#e6edf3">Standing: what the AI&#8217;s call on one item is worth before you do anything</text>
<text x="42" y="52" font-size="12.5" fill="#9198a1">These four sit in order on one qualitative scale. The order is a ranking, not a measured quantity, and it is one facet</text>
<text x="42" y="68" font-size="12.5" fill="#9198a1">rather than the categories themselves.</text>
<rect x="42" y="78" width="185" height="104" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="42" y="78" width="5" height="104" rx="2.5" fill="#6cb6ff"/>
<text x="60" y="103" font-size="14" font-weight="700" fill="#e6edf3">Delegation</text>
<text x="60" y="121" font-size="11.5" fill="#9198a1">7 systems</text>
<text x="60" y="144" font-size="11.5" fill="#e6edf3">It is the record.</text>
<text x="60" y="159" font-size="11.5" fill="#e6edf3">You rule once, at the end,</text>
<text x="60" y="174" font-size="11.5" fill="#e6edf3">on the whole finished work.</text>
<rect x="239" y="78" width="185" height="104" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="239" y="78" width="5" height="104" rx="2.5" fill="#6cb6ff"/>
<text x="257" y="103" font-size="14" font-weight="700" fill="#e6edf3">Standing Verdicts</text>
<text x="257" y="121" font-size="11.5" fill="#9198a1">6 systems</text>
<text x="257" y="144" font-size="11.5" fill="#e6edf3">It stands until</text>
<text x="257" y="159" font-size="11.5" fill="#e6edf3">someone reverses it.</text>
<rect x="436" y="78" width="185" height="104" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="436" y="78" width="5" height="104" rx="2.5" fill="#6cb6ff"/>
<text x="454" y="103" font-size="14" font-weight="700" fill="#e6edf3">Human Approval</text>
<text x="454" y="121" font-size="11.5" fill="#9198a1">5 systems</text>
<text x="454" y="144" font-size="11.5" fill="#e6edf3">It waits for a named</text>
<text x="454" y="159" font-size="11.5" fill="#e6edf3">person's ruling,</text>
<text x="454" y="174" font-size="11.5" fill="#e6edf3">which gets recorded.</text>
<rect x="633" y="78" width="185" height="104" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="633" y="78" width="5" height="104" rx="2.5" fill="#6cb6ff"/>
<text x="651" y="103" font-size="14" font-weight="700" fill="#e6edf3">Critique</text>
<text x="651" y="121" font-size="11.5" fill="#9198a1">2 systems</text>
<text x="651" y="144" font-size="11.5" fill="#e6edf3">It can never be</text>
<text x="651" y="159" font-size="11.5" fill="#e6edf3">the record. It comments</text>
<text x="651" y="174" font-size="11.5" fill="#e6edf3">on work you already have.</text>
<defs><marker id="arwdark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#6e7681"/></marker></defs>
<line x1="42" y1="216" x2="818" y2="216" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arwdark)"/>
<text x="42" y="238" font-size="12" fill="#9198a1">the AI&#8217;s call is already the record</text>
<text x="818" y="238" font-size="12" fill="#9198a1" text-anchor="end">it can never be the record</text>
<line x1="42" y1="278" x2="818" y2="278" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="42" y="308" font-size="14.5" font-weight="600" fill="#e6edf3">Bench is not further along that line. It answers a different question.</text>
<text x="42" y="330" font-size="13" fill="#9198a1">Arbiter: who settles whether the AI was right?</text>
<rect x="42" y="346" width="382" height="86" rx="7" fill="#132430" stroke="#30363d"/>
<text x="58" y="372" font-size="13.5" font-weight="700" fill="#6cb6ff">a reader</text>
<text x="58" y="393" font-size="11.5" fill="#e6edf3">A reader judges whether the AI was right.</text>
<text x="58" y="410" font-size="11.5" fill="#9198a1">The four categories above.</text>
<rect x="438" y="346" width="382" height="86" rx="7" fill="#241c11" stroke="#30363d"/>
<text x="454" y="372" font-size="13.5" font-weight="700" fill="#e3a94a">a run</text>
<text x="454" y="393" font-size="11.5" fill="#e6edf3">A measurement settles it, and that result</text>
<text x="454" y="408" font-size="11.5" fill="#e6edf3">feeds the next proposal. A human act is</text>
<text x="454" y="423" font-size="11.5" fill="#e6edf3">required in between. Bench &#183; 1 system.</text>
<text x="42" y="464" font-size="11.5" fill="#9198a1">Two of five facets shown. Placement also depends on Scope, Record and Target, tabulated in METHOD.md.</text>
</svg>