<svg xmlns="http://www.w3.org/2000/svg" width="860" height="436" viewBox="0 0 860 436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">How the five categories are arranged</title>
<desc id="figdesc">Four categories sit on one scale measuring what the machine&#8217;s call on an item is worth before the researcher acts. In Delegation it is the record. In Standing Verdicts it stands until someone reverses it. In Human Approval it waits for a named person&#8217;s ruling. In Critique it can never be the record. Bench sits off that scale because it answers a different question, namely who settles whether the AI was right: a reader for the other four, a run for Bench.</desc>
<rect width="860" height="436" fill="#0d1117"/>
<text x="42" y="34" font-size="14.5" font-weight="600" fill="#e6edf3">What the machine&#8217;s call on one item is worth before you do anything</text>
<text x="42" y="54" font-size="12.5" fill="#9198a1">These four sit on one scale. It is the closest thing here to a measure of how much say you keep.</text>
<rect x="42" y="74" width="185" height="96" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="42" y="74" width="5" height="96" rx="2.5" fill="#6cb6ff" opacity="0.13"/>
<rect x="42" y="74" width="5" height="96" rx="2.5" fill="#6cb6ff"/>
<text x="60" y="100" font-size="14" font-weight="700" fill="#e6edf3">Delegation</text>
<text x="60" y="119" font-size="11.5" fill="#9198a1">7 systems</text>
<text x="60" y="144" font-size="12" fill="#e6edf3">It is the record.</text>
<text x="60" y="160" font-size="12" fill="#e6edf3">You rule once, at the end.</text>
<rect x="239" y="74" width="185" height="96" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="239" y="74" width="5" height="96" rx="2.5" fill="#6cb6ff" opacity="0.13"/>
<rect x="239" y="105" width="5" height="65" rx="2.5" fill="#6cb6ff"/>
<text x="257" y="100" font-size="14" font-weight="700" fill="#e6edf3">Standing Verdicts</text>
<text x="257" y="119" font-size="11.5" fill="#9198a1">6 systems</text>
<text x="257" y="144" font-size="12" fill="#e6edf3">It stands until</text>
<text x="257" y="160" font-size="12" fill="#e6edf3">someone reverses it.</text>
<rect x="436" y="74" width="185" height="96" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="436" y="74" width="5" height="96" rx="2.5" fill="#6cb6ff" opacity="0.13"/>
<rect x="436" y="135" width="5" height="35" rx="2.5" fill="#6cb6ff"/>
<text x="454" y="100" font-size="14" font-weight="700" fill="#e6edf3">Human Approval</text>
<text x="454" y="119" font-size="11.5" fill="#9198a1">5 systems</text>
<text x="454" y="144" font-size="12" fill="#e6edf3">It waits for a named</text>
<text x="454" y="160" font-size="12" fill="#e6edf3">person's ruling.</text>
<rect x="633" y="74" width="185" height="96" rx="7" fill="#161b22" stroke="#30363d"/>
<rect x="633" y="74" width="5" height="96" rx="2.5" fill="#6cb6ff" opacity="0.13"/>
<rect x="633" y="163" width="5" height="7" rx="2.5" fill="#6cb6ff"/>
<text x="651" y="100" font-size="14" font-weight="700" fill="#e6edf3">Critique</text>
<text x="651" y="119" font-size="11.5" fill="#9198a1">2 systems</text>
<text x="651" y="144" font-size="12" fill="#e6edf3">It can never be</text>
<text x="651" y="160" font-size="12" fill="#e6edf3">the record.</text>
<defs><marker id="arwdark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#6e7681"/></marker></defs>
<line x1="42" y1="204" x2="818" y2="204" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arwdark)"/>
<text x="42" y="226" font-size="12" fill="#9198a1">the call counts in full</text>
<text x="818" y="226" font-size="12" fill="#9198a1" text-anchor="end">the call can never count</text>
<line x1="42" y1="266" x2="818" y2="266" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="42" y="296" font-size="14.5" font-weight="600" fill="#e6edf3">Bench is not further along that line. It answers a different question.</text>
<text x="42" y="318" font-size="13" fill="#9198a1">Who settles whether the AI was right?</text>
<rect x="42" y="334" width="382" height="76" rx="7" fill="#132430" stroke="#30363d"/>
<text x="58" y="361" font-size="13.5" font-weight="700" fill="#6cb6ff">a reader</text>
<text x="58" y="382" font-size="12" fill="#e6edf3">Someone opens the source and checks.</text>
<text x="58" y="399" font-size="12" fill="#9198a1">The four categories above.</text>
<rect x="438" y="334" width="382" height="76" rx="7" fill="#241c11" stroke="#30363d"/>
<text x="454" y="361" font-size="13.5" font-weight="700" fill="#e3a94a">a run</text>
<text x="454" y="382" font-size="12" fill="#e6edf3">A measurement comes back and settles it.</text>
<text x="454" y="399" font-size="12" fill="#9198a1">Bench &#183; 1 system.</text>
</svg>