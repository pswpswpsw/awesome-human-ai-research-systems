<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="742" viewBox="0 0 1000 742" font-family="&quot;Iowan Old Style&quot;,&quot;Palatino Linotype&quot;,Palatino,&quot;Book Antiqua&quot;,Georgia,&quot;Times New Roman&quot;,serif" role="img" aria-labelledby="gt gd">
<title id="gt">Which systems do the same job</title>
<desc id="gd">A graph of all 18 systems. Two systems are joined when they return the same kind of thing: searching the literature, screening and extracting for a review, judging citations, writing a draft, checking a finished manuscript, or picking the next experiment. Node colour and shape both mark the category, meaning what the human still rules on. There are two kinds of link. A plain solid link, 27 of them, joins two systems in the same category, so they are straightforward alternatives. A thicker dashed link, 9 of them, joins two systems in different categories: they do the same job but leave the researcher answerable for different things. The dashed links join Elicit to ClawsGO Science, Semantic Scholar, Consensus, Undermind, Ai2 Asta and OpenScholar; Review-it to SciScore and Reviewer3; Labguru Assistant to Atinary SDLabs.</desc>
<rect width="1000" height="742" fill="#0d1117"/>
<text x="34" y="34" font-size="17" font-weight="600" fill="#e9e6e1">Which systems do the same job</text>
<text x="34" y="55" font-size="12.5" font-style="italic" fill="#9a978f">A link joins two systems that return the same kind of thing. What the link looks like tells you whether they also sit in the same category.</text>
