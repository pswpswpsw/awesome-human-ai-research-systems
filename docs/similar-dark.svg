<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="742" viewBox="0 0 1000 742" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="gt gd">
<title id="gt">Which systems do the same job</title>
<desc id="gd">A graph of all 21 systems. Two systems are joined when they return the same kind of thing: searching the literature, screening and extracting for a review, judging citations, writing a draft, checking a finished manuscript, or picking the next experiment. Node colour is the category, meaning what the human still rules on. There are two kinds of link. A plain solid link, 32 of them, joins two systems in the same category, so they are straightforward alternatives. A thicker dashed link, 13 of them, joins two systems in different categories: they do the same job but leave the researcher answerable for different things. Those dashed links are ClawsGO Science to the five Human Approval screening platforms, Elicit to the five Standing Verdicts search tools, Review-it to the two Critique manuscript checkers, and Atinary SDLabs to Labguru Assistant.</desc>
<rect width="1000" height="742" fill="#0d1117"/>
<text x="34" y="32" font-size="14.5" font-weight="600" fill="#e6edf3">Which systems do the same job</text>
<text x="34" y="52" font-size="12" fill="#9198a1">A link joins two systems that return the same kind of thing. What the link looks like tells you whether they also sit in the same category.</text>
