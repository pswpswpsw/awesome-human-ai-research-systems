<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="gt gd">
<title id="gt">Which systems do the same job</title>
<desc id="gd">A graph of all 21 systems. Two systems are joined when they do the same job, read off what each one documents that it returns: searching the literature, screening and extracting for a review, judging citations, writing a draft, checking a finished manuscript, or picking the next experiment. Node colour is the category, meaning what the human still rules on. 13 of the 45 links join systems of different colours: those are the pairs a researcher would compare that nonetheless leave the human answerable for different things. ClawsGO Science does review work alongside the Human Approval platforms with no human gate, Review-it checks manuscripts alongside the Critique tools but can write into the file, Elicit searches alongside the Standing Verdicts tools, and Atinary is paired with Labguru Assistant on choosing what to run next.</desc>
<rect width="1000" height="690" fill="#ffffff"/>
<text x="34" y="32" font-size="14.5" font-weight="600" fill="#12181f">Which systems do the same job</text>
<text x="34" y="52" font-size="12" fill="#5b6875">A link means the two return the same kind of thing. Colour is the category. 13 links join two colours: same job, different answerability.</text>
